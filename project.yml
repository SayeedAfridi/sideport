name: Sideport

# Generated by XcodeGen — edit this file, never the .xcodeproj.
#   brew install xcodegen && xcodegen generate     (or: make project)

options:
  bundleIdPrefix: dev.afridi
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: NU2JM39S5P
    CODE_SIGN_STYLE: Automatic
    # Shown in Finder's Get Info and the About panel, and the string the
    # release tag has to match. The `-beta.N` suffix is a semver prerelease:
    # App Store validation would reject a non-numeric CFBundleShortVersionString,
    # but this app ships under Developer ID, where nothing parses it.
    MARKETING_VERSION: "0.1.0-beta.1"
    CURRENT_PROJECT_VERSION: "1"
    # Swift 5 language mode for the AppKit/FileProvider glue only. Every target
    # in Package.swift stays on Swift 6; the completion-handler File Provider
    # API fights strict concurrency for no benefit at this layer. Revisit once
    # the extension's shape has settled.
    SWIFT_VERSION: "5.0"
    ENABLE_HARDENED_RUNTIME: YES
    # Xcode 16+ splits the executable into a .debug.dylib for faster
    # incremental builds, which the appex signing step then rejects with
    # "code object is not signed at all". Off for both targets.
    ENABLE_DEBUG_DYLIB: NO
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_MODULES: YES

packages:
  SideportPackage:
    path: .

targets:
  Sideport:
    type: application
    platform: macOS
    sources:
      - path: Apps/Sideport/Sources
      - path: Apps/Sideport/Assets.xcassets
    info:
      path: Apps/Sideport/Info.plist
      properties:
        CFBundleName: Sideport
        CFBundleDisplayName: Sideport
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        # Menu bar only — this app has no window worth a Dock icon.
        LSUIElement: true
        # Without this the app has no icon anywhere it is listed — the
        # File Providers pane in System Settings, Login Items, the Finder.
        # It is *not* what the sidebar draws; see the extension below.
        CFBundleIconName: AppIcon
    entitlements:
      path: Apps/Sideport/Sideport.entitlements
      properties:
        # Deliberately NOT sandboxed: it has to find and launch the user's adb
        # binary, which lives outside any container. See plans/01.
        com.apple.security.application-groups:
          - NU2JM39S5P.dev.afridi.sideport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.afridi.sideport
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: SideportPackage
        product: AdbKit
      - package: SideportPackage
        product: AdbFinderCore
      - target: SideportFileProvider
        embed: true
        codeSign: true

  # Name must NOT be "FileProvider": that module name collides with Apple's
  # own FileProvider framework, and `import FileProvider` is then silently
  # ignored as a self-import, taking every symbol in the target with it.
  SideportFileProvider:
    type: app-extension
    platform: macOS
    sources:
      - path: Apps/SideportFileProvider/Sources
    info:
      path: Apps/SideportFileProvider/Info.plist
      properties:
        CFBundleName: SideportFileProvider
        CFBundleDisplayName: Sideport
        # The Finder sidebar row for a domain. Not an icon file — Apple's only
        # supported hook is an SF Symbol named here, on the *extension*, which
        # Finder draws as a template glyph alongside Network and iCloud Drive.
        # gen3 is the bezel-less slab: no notch, no home button, nothing that
        # says iPhone to someone looking at their Android.
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleSymbolName: iphone.gen3
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.fileprovider-nonui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FileProviderExtension
          NSExtensionFileProviderDocumentGroup: NU2JM39S5P.dev.afridi.sideport
          # Q2 answered: iCloud Drive's own provider sets this, so it is
          # current, not legacy.
          NSExtensionFileProviderSupportsEnumeration: true
          # Without this the system creates an implicit *default* domain
          # alongside ours, and Finder labels that one with the app's name —
          # which is why the sidebar read "Sideport" instead of the device.
          # iCloud Drive disables it for the same reason.
          NSFileProviderDefaultDomainEnabled: false
          # Both of Apple's own providers set this. Without it the domain can
          # land in the disabled state, where browsing still works but every
          # write is rejected with NSFileProviderErrorDomainDisabled (-2011) —
          # a read-only mount that looks writable.
          NSExtensionFileProviderEnabledByDefault: true
          # Show the domain's own name in the sidebar rather than prefixing it
          # with the provider's.
          NSFileProviderHideExtensionName: true
    entitlements:
      path: Apps/SideportFileProvider/SideportFileProvider.entitlements
      properties:
        # Sandboxed by force — app extensions get no choice. This is exactly why
        # AdbKit speaks the wire protocol instead of spawning adb.
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - NU2JM39S5P.dev.afridi.sideport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.afridi.sideport.FileProvider
    dependencies:
      - package: SideportPackage
        product: AdbKit
      - package: SideportPackage
        product: AdbFinderCore
