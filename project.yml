name: FinderADB

# Generated by XcodeGen — edit this file, never the .xcodeproj.
#   brew install xcodegen && xcodegen generate     (or: make project)

options:
  bundleIdPrefix: dev.afridi
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: NU2JM39S5P
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Swift 5 language mode for the AppKit/FileProvider glue only. Every target
    # in Package.swift stays on Swift 6; the completion-handler File Provider
    # API fights strict concurrency for no benefit at this layer. Revisit once
    # the extension's shape has settled.
    SWIFT_VERSION: "5.0"
    ENABLE_HARDENED_RUNTIME: YES
    # Xcode 16+ splits the executable into a .debug.dylib for faster
    # incremental builds, which the appex signing step then rejects with
    # "code object is not signed at all". Off for both targets.
    ENABLE_DEBUG_DYLIB: NO
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_MODULES: YES

packages:
  FinderADBPackage:
    path: .

targets:
  FinderADB:
    type: application
    platform: macOS
    sources:
      - path: Apps/FinderADB/Sources
      - path: Apps/FinderADB/Assets.xcassets
    info:
      path: Apps/FinderADB/Info.plist
      properties:
        CFBundleName: FinderADB
        CFBundleDisplayName: Finder ADB
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        # Menu bar only — this app has no window worth a Dock icon.
        LSUIElement: true
        # The Finder sidebar takes a domain's icon from the containing app, so
        # without this the device shows up under the generic application icon.
        CFBundleIconName: AppIcon
    entitlements:
      path: Apps/FinderADB/FinderADB.entitlements
      properties:
        # Deliberately NOT sandboxed: it has to find and launch the user's adb
        # binary, which lives outside any container. See plans/01.
        com.apple.security.application-groups:
          - NU2JM39S5P.dev.afridi.finderadb
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.afridi.finderadb
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: FinderADBPackage
        product: AdbKit
      - package: FinderADBPackage
        product: AdbFinderCore
      - target: FinderADBFileProvider
        embed: true
        codeSign: true

  # Name must NOT be "FileProvider": that module name collides with Apple's
  # own FileProvider framework, and `import FileProvider` is then silently
  # ignored as a self-import, taking every symbol in the target with it.
  FinderADBFileProvider:
    type: app-extension
    platform: macOS
    sources:
      - path: Apps/FinderADBFileProvider/Sources
    info:
      path: Apps/FinderADBFileProvider/Info.plist
      properties:
        CFBundleName: FinderADBFileProvider
        CFBundleDisplayName: Finder ADB
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.fileprovider-nonui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FileProviderExtension
          NSExtensionFileProviderDocumentGroup: NU2JM39S5P.dev.afridi.finderadb
          # Q2 answered: iCloud Drive's own provider sets this, so it is
          # current, not legacy.
          NSExtensionFileProviderSupportsEnumeration: true
          # Without this the system creates an implicit *default* domain
          # alongside ours, and Finder labels that one with the app's name —
          # which is why the sidebar read "FinderADB" instead of the device.
          # iCloud Drive disables it for the same reason.
          NSFileProviderDefaultDomainEnabled: false
          # Show the domain's own name in the sidebar rather than prefixing it
          # with the provider's.
          NSFileProviderHideExtensionName: true
    entitlements:
      path: Apps/FinderADBFileProvider/FinderADBFileProvider.entitlements
      properties:
        # Sandboxed by force — app extensions get no choice. This is exactly why
        # AdbKit speaks the wire protocol instead of spawning adb.
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - NU2JM39S5P.dev.afridi.finderadb
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.afridi.finderadb.FileProvider
    dependencies:
      - package: FinderADBPackage
        product: AdbKit
      - package: FinderADBPackage
        product: AdbFinderCore
